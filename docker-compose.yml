name: quickbite-warehouse

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: quickbite-airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "local-dev-only-change-me"
    QB_START_DATE: ${QB_START_DATE:-2026-09-23}
    WAREHOUSE: ${WAREHOUSE:-duckdb}
    DBT_TARGET: ${WAREHOUSE:-duckdb}
    GCP_PROJECT: ${GCP_PROJECT:-}
    GCS_BUCKET: ${GCS_BUCKET:-}
    BQ_LOCATION: ${BQ_LOCATION:-asia-south1}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./quickbite:/opt/quickbite/quickbite
    - ./transform:/opt/quickbite/transform
    - ./secrets:/opt/quickbite/secrets:ro
    - warehouse-data:/opt/quickbite/data
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # One-off setup: DB migration, admin user, the warehouse pool, dbt packages.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        /entrypoint airflow version
        airflow pools set warehouse 1 "DuckDB allows one writer at a time"
        cd /opt/quickbite/transform && /opt/dbt-venv/bin/dbt deps
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # dbt docs site with the lineage graph: `make docs` -> http://localhost:8081
  dbt-docs:
    <<: *airflow-common
    profiles: ["docs"]
    entrypoint: /bin/bash
    command:
      - -c
      - cd /opt/quickbite/transform && /opt/dbt-venv/bin/dbt docs generate && /opt/dbt-venv/bin/dbt docs serve --host 0.0.0.0 --port 8081 --no-browser
    ports:
      - "8081:8081"
    depends_on: *airflow-depends

volumes:
  postgres-data:
  warehouse-data:
  airflow-logs:
