name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  pipeline-e2e:
    name: End-to-end on DuckDB (generator, loader, all dbt models and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Unit tests
        run: pytest -q
      - name: dbt deps
        run: cd transform && dbt deps
        env:
          DBT_PROFILES_DIR: .
      - name: Run 5 days (snapshot + incremental + every data test and unit test)
        run: python -m quickbite.run_local --start 2026-09-01 --days 5
      - name: Re-run the last day and prove nothing changes (idempotency)
        run: |
          count() { python -c "import duckdb; c=duckdb.connect('data/warehouse.duckdb', read_only=True); print(c.sql(\"select count(*), sum(net_amount) from marts.fct_orders\").fetchone())"; }
          before=$(count)
          python -m quickbite.run_local --start 2026-09-05 --days 1
          after=$(count)
          echo "before=$before after=$after"
          test "$before" = "$after"

  dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airflow (with its official constraints)
        run: |
          pip install "apache-airflow==2.10.5" duckdb pyarrow pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: Run DAG integrity tests (against a throwaway SQLite metadata DB)
        run: |
          airflow db migrate
          pytest -q tests/test_dag_integrity.py
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
